apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: istiod
    targetRevision: 1.31.1
    helm:
      releaseName: istiod
      valuesObject:
        replicaCount: 1
        autoscaleEnabled: false
        base:
          # Avoid failurePolicy field ownership conflicts with istiod under SSA.
          validationFailurePolicy: Fail
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # Retry while istio-base CRDs and admission prerequisites become available.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
