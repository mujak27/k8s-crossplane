apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-root-ca
  namespace: cert-manager
spec:
  secretName: homelab-root-ca
  isCA: true
  commonName: Homelab Root CA
  subject:
    organizations:
      - Homelab
  duration: 87600h
  renewBefore: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
    # Root key rotation must be deliberate, not an automatic renewal side effect.
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
