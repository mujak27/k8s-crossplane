apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-pki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/mujak27/k8s-crossplane
    targetRevision: main
    path: infra/homelab-pki/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    # Child Application waves do not guarantee cert-manager is ready.
    # Retry failed syncs while its CRDs and webhook become available.
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
