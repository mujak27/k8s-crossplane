apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/mujak27/k8s-crossplane
    targetRevision: main
    path: crossplane/_shared
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
