apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: gateway
    targetRevision: 1.31.1
    helm:
      releaseName: istio-ingress
      valuesObject:
        replicaCount: 1
        autoscaling:
          enabled: false
        service:
          type: NodePort
          # Separate ports preserve the existing NGINX ingress.
          externalTrafficPolicy: Cluster
          ports:
            # Restrict this health endpoint to trusted networks.
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
              nodePort: 30021
            - name: http2
              port: 80
              protocol: TCP
              targetPort: 80
              nodePort: 30081
            - name: https
              port: 443
              protocol: TCP
              targetPort: 443
              nodePort: 30444
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  # Sync after istiod is ready; do not disable injection in this namespace.
  # Listeners, routes, and TLS certificates are configured separately.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
