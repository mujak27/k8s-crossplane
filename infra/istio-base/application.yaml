apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: base
    targetRevision: 1.31.1
    helm:
      releaseName: istio-base
      valuesObject:
        defaultRevision: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # Initial rollout is manual: establish CRDs before syncing istiod.
  # Parent Application waves do not gate child installation readiness.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
