apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Application health is not built in. Propagate it so parent sync waves wait
  # for child apps to be both Synced and Healthy before creating the next wave.
  resource.customizations.health.argoproj.io_Application: |
    hs = { status = "Progressing", message = "Waiting for child application to sync" }
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.message = obj.status.health.message or hs.message
        if obj.status.health.status == "Degraded" then
          hs.status = "Degraded"
          return hs
        end
        if obj.status.sync ~= nil and obj.status.sync.status == "Synced" then
          hs.status = obj.status.health.status
        end
      end
    end
    return hs
