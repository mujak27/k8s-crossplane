apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Application health is not built in. Gate only explicitly labelled children,
  # preserving the existing sync-wave behavior for unrelated infrastructure.
  resource.customizations.health.argoproj.io_Application: |
    if obj.metadata.labels == nil or obj.metadata.labels["k8s-crossplane/sync-gate"] ~= "true" then
      return { status = "Healthy", message = "Application is not a sync gate" }
    end
    hs = { status = "Progressing", message = "Waiting for child application to sync" }
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.message = obj.status.health.message or hs.message
        if obj.status.health.status == "Degraded" then
          hs.status = "Degraded"
          return hs
        end
        if obj.status.sync ~= nil and obj.status.sync.status == "Synced" then
          hs.status = obj.status.health.status
        end
      end
    end
    return hs
