name: Validate public manifests
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Install pinned validation tools
        run: |
          python -m pip install --disable-pip-version-check 'yamllint==1.35.1' 'PyYAML==6.0.2' 'pathspec==1.1.1'
          scripts/install-validation-tools.sh "$RUNNER_TEMP/validation-bin"
          echo "$RUNNER_TEMP/validation-bin" >> "$GITHUB_PATH"
      - name: Validate every public manifest
        run: scripts/validate.sh
