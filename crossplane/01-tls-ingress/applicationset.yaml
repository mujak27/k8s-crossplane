apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tls-ingress
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - stage: compositions
            namespace: crossplane-system
            repoURL: https://github.com/mujak27/crossplane-compilations
            path: 01-tls-ingress
            include: '{xrd.yaml,composition.yaml,rbac.yaml}'
            targetRevision: 34640c4c65119295e75ffab660759bc9ea3b0b3e
          - stage: xr
            namespace: default
            repoURL: https://github.com/mujak27/k8s-crossplane
            path: crossplane/01-tls-ingress/xr
            include: xr.yaml
            targetRevision: main
  # This set owns just the TLS dependency group. Other groups get their own set.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: k8s-crossplane/stage
              operator: In
              values:
                - compositions
          maxUpdate: 1
        - matchExpressions:
            - key: k8s-crossplane/stage
              operator: In
              values:
                - xr
          maxUpdate: 1
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'tls-ingress-{{.stage}}'
      labels:
        k8s-crossplane/dependency-group: tls-ingress
        k8s-crossplane/stage: '{{.stage}}'
    spec:
      project: default
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: '{{.targetRevision}}'
        path: '{{.path}}'
        directory:
          recurse: false
          include: '{{.include}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # RollingSync triggers syncs itself; generated apps must not auto-sync.
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
