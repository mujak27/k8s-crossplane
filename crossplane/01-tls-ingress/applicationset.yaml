apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tls-ingress
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - stage: compositions
            namespace: crossplane-system
            repoURL: https://github.com/mujak27/crossplane-compilations
            path: 01-tls-ingress
            include: '{xrd.yaml,composition.yaml,rbac.yaml}'
          - stage: xr
            namespace: default
            repoURL: https://github.com/mujak27/k8s-crossplane
            path: crossplane/01-tls-ingress/xr
            include: xr.yaml
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'tls-ingress-{{.stage}}'
      labels:
        k8s-crossplane/dependency-group: tls-ingress
        k8s-crossplane/stage: '{{.stage}}'
    spec:
      project: default
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: main
        path: '{{.path}}'
        directory:
          recurse: false
          include: '{{.include}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # AllAtOnce permits child auto-sync; retry prerequisite admission failures.
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
