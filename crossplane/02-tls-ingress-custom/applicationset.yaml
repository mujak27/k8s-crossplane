apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tls-ingress-custom
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - stage: compositions
            namespace: crossplane-system
            path: crossplane/02-tls-ingress-custom/compositions
          - stage: xr
            namespace: default
            path: crossplane/02-tls-ingress-custom/xr
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'tls-ingress-custom-{{.stage}}'
      labels:
        k8s-crossplane/dependency-group: tls-ingress-custom
        k8s-crossplane/stage: '{{.stage}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mujak27/k8s-crossplane
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # AllAtOnce permits child auto-sync; retry prerequisite admission failures.
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
