apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/mujak27/crossplane-compilations/749abc378474fc80939b59ceb11457ae7e4a4300/02-tls-ingress-custom/xrd.yaml
  - https://raw.githubusercontent.com/mujak27/crossplane-compilations/749abc378474fc80939b59ceb11457ae7e4a4300/02-tls-ingress-custom/composition.yaml
  - rbac.yaml
patches:
  # The published function can emit Expired; upstream's schema omits it.
  - target:
      group: apiextensions.crossplane.io
      version: v2
      kind: CompositeResourceDefinition
      name: xingresstlscustom.platform.mujak.com
    patch: |-
      - op: add
        path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/certificate/properties/health/enum/-
        value: Expired
