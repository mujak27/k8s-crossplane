apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-secure-egress
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - stage: origin
            namespace: secure-egress-origin
            path: crossplane/03-istio-secure-egress/origin
          - stage: upstream
            namespace: istio-egress
            path: crossplane/03-istio-secure-egress/upstream
          - stage: compositions
            namespace: crossplane-system
            path: crossplane/03-istio-secure-egress/compositions
          - stage: xr
            namespace: secure-egress-demo
            path: crossplane/03-istio-secure-egress/xr
          - stage: client
            namespace: secure-egress-demo
            path: crossplane/03-istio-secure-egress/client
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'istio-secure-egress-{{.stage}}'
      labels:
        k8s-crossplane/dependency-group: istio-secure-egress
        k8s-crossplane/stage: '{{.stage}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mujak27/k8s-crossplane
        targetRevision: main
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # Only an explicitly authorized operator opens the first-traffic gate.
      ignoreDifferences:
        - group: batch
          kind: Job
          name: secure-egress-client
          namespace: secure-egress-demo
          jsonPointers: [/spec/suspend]
      # AllAtOnce permits child auto-sync; retry prerequisite admission failures.
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
